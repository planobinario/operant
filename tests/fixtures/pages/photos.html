<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Galería de fotos (evidencia visual)</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 24px; }
      h1 { font-size: 18px; }
      img { display: block; max-width: 640px; margin: 16px 0; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Galería de fotos — ratios variados</h1>
    <img src="/img/g/1200/800/1" alt="foto panorámica 1" width="1200" height="800" />
    <img src="/img/g/900/1200/2" alt="foto vertical 2" width="900" height="1200" />
    <img src="/img/g/1600/600/3" alt="foto muy ancha 3" width="1600" height="600" />
    <img src="/img/g/800/800/4" alt="foto cuadrada 4" width="800" height="800" />
    <img src="/img/g/1200/900/5" alt="foto apaisada 5" width="1200" height="900" />
    <img src="/img/g/1000/1400/6" alt="foto vertical 6" width="1000" height="1400" />
    <img src="/img/g/1400/1050/7" alt="foto apaisada 7" width="1400" height="1050" />
    <img src="/img/g/640/960/8" alt="foto vertical 8" width="640" height="960" />
    <img src="/img/g/1600/900/9" alt="foto 16:9 9" width="1600" height="900" />
    <img src="/img/g/900/900/10" alt="foto cuadrada 10" width="900" height="900" />
  </body>
</html>
