<!DOCTYPE html><html><head><meta charset="utf-8"><title>shadow</title></head><body>
    <h1>Shadow DOM</h1>
    <custom-widget id="open"></custom-widget>
    <closed-widget id="closed"></closed-widget>
    <div style="background-image:url('/img/250x150?g=shadowbg')"></div>
    <script>
      class OpenWidget extends HTMLElement {
        constructor() {
          super();
          const r = this.attachShadow({ mode: "open" });
          r.innerHTML = '<img src="/img/200x120?g=shadow1"><img data-src="/img/200x120?g=shadow2"><video src="/media/sample.mp4"></video>';
        }
      }
      class ClosedWidget extends HTMLElement {
        constructor() {
          super();
          const r = this.attachShadow({ mode: "closed" });
          r.innerHTML = '<img src="/img/200x120?g=closed1">';
        }
      }
      customElements.define("custom-widget", OpenWidget);
      customElements.define("closed-widget", ClosedWidget);
    </script></body></html>
