# CI de Operant
#
# Antes de este workflow no existía NINGÚN archivo de CI en el repositorio
# (verificado sobre las 32 revisiones de todos los refs). Todo —lint, tests,
# build del host nativo, empaquetado— era manual y local, lo que hacía posible
# que un diff de miles de líneas llegara a producción sin comprobar nada.
#
# Esta CI es deliberadamente rápida y de dos capas:
#   1. `quality`  — sintaxis + tests unitarios + lint de la extensión + Rust.
#      Es la que bloquea el merge. Tarda menos de un minuto.
#   2. `integration` — la verificación real en Chrome (Puppeteer) y el build de
#      Firefox. Tarda minutos y descarga un Chrome, así que va aparte.
#
# Lo que esta CI NO cubre todavía (y está anotado en el README como deuda):
#   - Firefox real (Playwright sobre dist-firefox/)
#   - Métricas de cobertura (no hay umbral porque la cobertura de líneas no
#     describe este código: casi todo es parseo y E/S con APIs del navegador)
#   - Pruebas de descarga con bytes verificados en disco

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo ref: no aporta nada y consume minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Sintaxis, unitarios, lint de extensión y host nativo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Comprobar que los fixtures están versionados
        # El .gitignore tuvo un `*.zip` global que excluía los fixtures que el
        # caso 04 del harness verifica, de modo que el test fallaba en un clon
        # limpio. Este paso es la red que evita que vuelva a pasar.
        run: |
          test -f tests/fixtures/media/sample.zip || {
            echo "::error::falta tests/fixtures/media/sample.zip (¿regla de .gitignore demasiado amplia?)"
            exit 1
          }

      - name: Comprobar la coherencia de versiones
        # Existían 9 sitios con 4 valores distintos (package.json 0.4.1,
        # package-lock 0.4.0, manifest 0.4.1, Cargo.toml 0.4.0, el User-Agent
        # del host, el zip de web-ext, dist-firefox...). Se comprueba lo que se
        # puede comprobar sin herramientas extra.
        run: node scripts/check-version.mjs

      - name: Gate de sintaxis (acorn)
        run: npm run lint

      - name: Tests unitarios
        run: npm run test:unit

      - name: Coherencia del extension ID
        # El ID de la extensión vive en tres sitios (manifest.key, key_info.json
        # e installer.rs). Rotar la clave obliga a cambiarlos a mano, y si uno
        # se queda atrás el host se registra contra un ID inexistente: el panel
        # dice "host no instalado" para siempre, sin ninguna pista de por qué.
        run: npm run key:verify

      - name: Sin claves privadas en el arbol ni en el historial reciente
        # native-host/key_info.json llegó a contener la clave PRIVADA RSA de la
        # extensión: con ella, cualquiera podía publicar actualizaciones de la
        # extensión instalada. Con ella publicada, esa clave queda COMPROMETIDA
        # para siempre y rotarla es la única forma de cerrarlo (por eso el
        # historial se reescribió y el ID cambió).
        run: |
          if git grep -nI -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" -- . ; then
            echo "::error::se ha encontrado una clave privada en el arbol"
            exit 1
          fi
          echo "sin claves privadas en el arbol"

      - name: Rust — formato
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust — clippy sin warnings
        run: cargo clippy --manifest-path native-host-rs/Cargo.toml --all-targets -- -D warnings

      - name: Rust — tests
        run: cargo test --manifest-path native-host-rs/Cargo.toml


      - name: "Bargaining: no hay binarios compilados versionados"
        # `native-host/operant-host.exe` estuvo commiteado (2,5 MB, el 23,5 % de
        # los bytes del repo) y desincronizado del src actual. Es un artefacto
        # de `cargo build`, no código: si vuelve a aparecer en el índice, el
        # repo vuelve a crecer 2,5 MB por commit y a distribuir binarios que
        # nadie revisa. Este paso es la red que lo mantiene fuera.
        run: |
          if git ls-files | grep -qiE '\.(exe|dll|so|dylib|msi)$'; then
            echo "::error::hay binarios compilados en el índice:"
            git ls-files | grep -iE '\.(exe|dll|so|dylib|msi)$'
            exit 1
          fi
          echo "sin binarios compilados en el índice"

      - name: Subir resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            tests/results/*.json
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Verificación en Chrome real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar fixtures
        # El harness asume que existen; en un clon limpio hay que generarlos.
        run: npm run test:fixtures

      - name: Descargar Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable

      - name: Verificación de extremo a extremo (modo local, sin red externa)
        # Modo local: no incluye los casos contra sitios públicos, que fallan
        # por anti-bot (403) y hacen la CI no determinista.
        run: npm run test:verify

      - name: Auditoría del panel
        run: npm run test:audit

      - name: Empaquetar la extensión
        run: npm run build

      - name: Construir el paquete de Firefox
        run: npm run build:firefox

      - name: Validar el manifest con addons-linter (baseline con dientes)
        # Se valida dist-firefox y no src porque addons-linter comprueba contra
        # Firefox, donde `background.service_worker` no existe (por eso existe
        # build-firefox.mjs, que lo traduce a `background.scripts`).
        #
        # No basta con exigir 0 errores: el build arrastra 20 avisos preexistentes
        # (16 `innerHTML` sobre SVG estático propio, 4 `DANGEROUS_EVAL` de código
        # de terceros). Aceptarlos a ciegas deja pasar los nuevos, que es lo
        # que importa. check-lint-baseline.mjs exige 0 errores Y que la lista de
        # avisos sea exactamente la del baseline: añadir un `innerHTML` nuevo
        # rompe la CI, y hacerlo desaparecer obliga a actualizar el baseline a
        # mano.
        run: npx --yes web-ext lint --source-dir=./dist-firefox 2>&1 | tee lint-report.txt || true

      - name: Congelar la deuda de lint (baseline con dientes)
        # No basta con exigir 0 errores: el build arrastra 20 avisos preexistentes
        # (16 `innerHTML` sobre SVG estático propio, 4 `DANGEROUS_EVAL` de código
        # de terceros). Aceptarlos a ciegas deja pasar los nuevos, que es lo
        # que importa. check-lint-baseline.mjs exige 0 errores Y que la lista de
        # avisos sea exactamente la del baseline: añadir un `innerHTML` nuevo
        # rompe la CI, y hacerlo desaparecer obliga a actualizar el baseline a
        # mano. El script ejecuta el linter por su cuenta.
        run: node scripts/check-lint-baseline.mjs

      - name: Comprobar que el manifest de Firefox está sincronizado
        # dist-firefox/ se quedaba en 0.4.0 mientras src iba a 0.4.1: una
        # build obsoleta se publicaba sin que nadie lo notase.
        run: node scripts/check-firefox-build.mjs

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: web-ext-artifacts/*.zip
          retention-days: 14
          if-no-files-found: ignore

      - name: Subir capturas y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: tests/results/
          retention-days: 7
          if-no-files-found: ignore
